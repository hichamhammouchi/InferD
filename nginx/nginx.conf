# InferD - Nginx configuration
# TLS termination for the cloud API facades -> uvicorn on 127.0.0.1:8000.
# The self-hosted services do not use this proxy; they bind their ports directly.
# Point ssl_certificate at any cert for your facade host (self-signed for a lab,
# a public CA for a publicly reachable deployment).
# Streaming endpoints disable proxy buffering so SSE chunks flush immediately.

# Global upstream
upstream inferd_api {
    server 127.0.0.1:8000;
    keepalive 64;
}

# Redirect all HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}

# Cloud API facades (OpenAI / Anthropic / Gemini / Assistants / MCP)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/inferd/tls/cert.pem;
    ssl_certificate_key /etc/inferd/tls/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                              always;
    add_header X-Frame-Options           "DENY"                                 always;
    add_header Referrer-Policy           "no-referrer"                          always;

    # Request size - accept large bodies (RAG upserts can be big)
    client_max_body_size 32m;

    # Timeouts generous enough for streaming responses
    proxy_read_timeout  600s;
    proxy_send_timeout  600s;
    proxy_connect_timeout 10s;

    # Common proxy headers
    # X-Real-IP: used by honeypot middleware to extract the true client IP.
    # X-TLS-Cipher / X-TLS-Protocol: forwarded verbatim into EventRecord for
    # fingerprinting the client's TLS stack.
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-TLS-Cipher       $ssl_cipher;
    proxy_set_header X-TLS-Protocol     $ssl_protocol;
    proxy_http_version 1.1;
    proxy_set_header Connection "";   # keep-alive to upstream

    # Streaming endpoints (SSE)
    # Disable buffering so chunks reach the client immediately.
    # Matched for all AI API streaming endpoints.
    location ~ ^/v1/(chat/completions|completions) {
        proxy_pass          http://inferd_api;
        proxy_buffering     off;
        proxy_cache         off;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    X-TLS-Cipher      $ssl_cipher;
        proxy_set_header    X-TLS-Protocol    $ssl_protocol;
        proxy_http_version  1.1;
        proxy_set_header    Connection        "";
        # Tell Nginx not to buffer SSE
        proxy_set_header    X-Accel-Buffering no;
        add_header          Cache-Control     "no-cache" always;
        add_header          X-Content-Type-Options "nosniff" always;
    }

    # Anthropic streaming
    location /v1/messages {
        proxy_pass          http://inferd_api;
        proxy_buffering     off;
        proxy_cache         off;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    X-TLS-Cipher      $ssl_cipher;
        proxy_set_header    X-TLS-Protocol    $ssl_protocol;
        proxy_http_version  1.1;
        proxy_set_header    Connection        "";
        proxy_set_header    X-Accel-Buffering no;
        add_header          Cache-Control     "no-cache" always;
    }

    # Gemini streaming
    location ~ ^/v1beta/models/.+:streamGenerateContent {
        proxy_pass          http://inferd_api;
        proxy_buffering     off;
        proxy_cache         off;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    X-TLS-Cipher      $ssl_cipher;
        proxy_set_header    X-TLS-Protocol    $ssl_protocol;
        proxy_http_version  1.1;
        proxy_set_header    Connection        "";
        proxy_set_header    X-Accel-Buffering no;
        add_header          Cache-Control     "no-cache" always;
    }

    # MCP SSE transport (legacy)
    location /mcp/sse {
        proxy_pass          http://inferd_api;
        proxy_buffering     off;
        proxy_cache         off;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    X-TLS-Cipher      $ssl_cipher;
        proxy_set_header    X-TLS-Protocol    $ssl_protocol;
        proxy_http_version  1.1;
        proxy_set_header    Connection        "";
        proxy_read_timeout  3600s;   # MCP connections are long-lived
        proxy_set_header    X-Accel-Buffering no;
        add_header          Cache-Control     "no-cache" always;
    }

    # MCP Streamable HTTP transport (spec 2025-11-25)
    # POST /mcp handles JSON-RPC; GET /mcp carries server-push SSE.
    # Both need proxy_buffering off so server-sent events are not held in buffer.
    location /mcp {
        proxy_pass          http://inferd_api;
        proxy_buffering     off;
        proxy_cache         off;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    X-TLS-Cipher      $ssl_cipher;
        proxy_set_header    X-TLS-Protocol    $ssl_protocol;
        proxy_http_version  1.1;
        proxy_set_header    Connection        "";
        proxy_read_timeout  3600s;
        proxy_set_header    X-Accel-Buffering no;
        add_header          Cache-Control     "no-cache" always;
    }

    # All other API routes (non-streaming)
    location / {
        proxy_pass http://inferd_api;
    }
}

