<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>JupyterLab</title>
<link rel="icon" type="image/x-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAMAAABEpIrGAAAAM1BMVEX/sSH/sSH/sSH/sSH/sSH/sSH/sSH/sSH/sSH/sSH/sSH/sSH/sSH/sSH/sSH/sSGJmMV5AAAAEHRSTlMAECAwQFBgcICQoLDA0OD/pLFyAAAAwElEQVQ4y42T2xKDIAxEQy5CuPz/3xYQqtjO9KWZnJwsiTsREbEKqoqIiCqqamZmZmZmZmZm5maWZrZRVe2cqhq3eAMAAP//7dIxDoMwDEXR90gi2ez9L1siRQwFquLp+WwZKVIkd3RVHREREQEAAAAAAAAAAAAAAAAAAAAAAADg7u4OAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA4Hd3dwAAAAAAAAAAAAAAAAAAAAA3NzcAAAAAAAAAAAAAAAAAAAAAAAB+DwAAAABJRU5ErkJggg=="/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f5f5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    color: #1a1a2e;
  }
  .container {
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.12);
    padding: 40px 48px;
    width: 100%;
    max-width: 440px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
    justify-content: center;
  }
  .logo-icon {
    width: 48px;
    height: 48px;
    background: linear-gradient(135deg, #F37626 60%, #9E9E9E 100%);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 900;
    font-size: 22px;
    letter-spacing: -1px;
  }
  .logo-text { font-size: 22px; font-weight: 600; color: #333; }
  h2 { font-size: 18px; font-weight: 500; margin-bottom: 8px; color: #333; }
  p.hint {
    font-size: 13px;
    color: #666;
    margin-bottom: 24px;
    line-height: 1.5;
  }
  label { font-size: 13px; font-weight: 500; color: #444; display: block; margin-bottom: 6px; }
  input[type=password] {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
    font-family: monospace;
    letter-spacing: 1px;
  }
  input[type=password]:focus { border-color: #F37626; box-shadow: 0 0 0 3px rgba(243,118,38,0.1); }
  button {
    width: 100%;
    margin-top: 20px;
    padding: 11px;
    background: #F37626;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #d6641a; }
  .footer {
    margin-top: 32px;
    font-size: 12px;
    color: #999;
    text-align: center;
  }
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <div class="logo-icon">Ju</div>
    <div class="logo-text">JupyterLab</div>
  </div>
  <h2>Authentication required</h2>
  <p class="hint">
    Token authentication is enabled. Paste your server token below, or visit
    the server console to retrieve it.
  </p>
  <form action="/login" method="POST">
    <label for="password">Token</label>
    <input type="password" id="password" name="password"
           placeholder="Enter your token"
           autocomplete="current-password"
           autofocus/>
    <button type="submit">Log in</button>
  </form>
  <div class="footer">JupyterLab 4.2.5 &nbsp;|&nbsp; Python 3.12.1</div>
</div>
</body>
</html>
