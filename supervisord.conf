; OpenClaw gateway emulator (:18789, primary)
; Primary attack surface: WebSocket + HTTP multiplexed on 18789.
; Gateway-shaped probe capture for authentication, skill, owner-context, and WebSocket activity.
; HTTP requests use the shared per-IP rate limiter; WebSocket frames are logged separately.
[program:openclaw]
command=python3 -m uvicorn honeypot.services.openclaw_service:app
        --host 0.0.0.0
        --port 18789
        --workers 1
        --loop asyncio
        --ws-max-size 33554432
        --no-access-log
directory=/app
user=honeypot
autostart=true
autorestart=true
startretries=5
stdout_logfile=/data/logs/openclaw.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2
stderr_logfile=/data/logs/openclaw.err
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=1

