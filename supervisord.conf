; InferD supervisord configuration
;
; Manages 10 uvicorn process groups (1 cloud group + 9 self-hosted services).
; All child processes run as the honeypot user (UID set at image build).
; supervisord itself runs as root to perform the setuid.
;
; Logs go to /data/logs/ (inside the bind-mounted volume).
; stdout_logfile_maxbytes limits each log to 50 MB with 3 rotations.

[supervisord]
nodaemon=true
logfile=/data/logs/supervisord.log
logfile_maxbytes=20MB
logfile_backups=3
loglevel=info
pidfile=/tmp/supervisord.pid
user=root

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

; OpenAI API + Assistants API + MCP (:8000, behind Nginx :443)
[program:openai]
command=python3 -m uvicorn honeypot.services.openai_service:app
        --host 127.0.0.1
        --port 8000
        --workers 1
        --loop asyncio
        --no-access-log
directory=/app
user=honeypot
autostart=true
autorestart=true
startretries=5
stdout_logfile=/data/logs/openai.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile=/data/logs/openai.err
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2

